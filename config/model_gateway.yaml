# 模型降级链：主模型调用失败、超时或供应商异常时，按这里的顺序尝试。
# 注意：只有 enabled=true 且 API Key 已配置的模型才会真正进入运行时降级链。
# 你接入降级模型时，通常只需要：
# 1. 把下面候选模型对应的 enabled 改成 true
# 2. 配好对应 API Key 环境变量
# 3. 必要时调整每个 use_case 的顺序
fallback_policy:
  # 默认不对未知错误降级，避免认证、入参、结构化 schema 等真实缺陷被 fallback 掩盖。
  fallback_on_unknown_error: false
  # 只有供应商临时性问题才自动降级；业务错误和配置错误应直接暴露。
  retryable_error_types:
    - timeout
    - rate_limit
    - server_error
    - connection_error

fallback_models:
  agent: [qwen3.7-max, kimi-chat, deepseek-chat]
  workflow: [qwen3.7-max, kimi-chat, deepseek-chat]
  plan_execute: [qwen3.7-max, kimi-chat, deepseek-chat]
  supervisor: [qwen3.7-max, claude-sonnet, deepseek-chat]
  multi_agent: [qwen3.7-max, deepseek-chat]
  mcp: [qwen-flash, local-qwen-small, deepseek-chat]
  judge: [claude-sonnet, deepseek-chat]
  workflow_finalize: [qwen-flash, local-qwen-small, deepseek-chat]
  structured_extract: [qwen-flash, local-qwen-small, deepseek-chat]
  rag_rewrite: [qwen-flash, local-qwen-small, deepseek-chat]
  memory_extraction: [qwen-flash, local-qwen-small, deepseek-chat]
  intent_classification: [qwen-flash, local-qwen-small, deepseek-chat]
  query_rewrite: [qwen-flash, local-qwen-small, deepseek-chat]
  planner: [qwen3.7-max, kimi-chat, deepseek-chat]
  replan: [qwen3.7-max, kimi-chat, deepseek-chat]
  replanner: [qwen3.7-max, kimi-chat, deepseek-chat]
  case_extraction: [qwen-flash, local-qwen-small, deepseek-chat]
  rag_compress: [qwen-flash, local-qwen-small, deepseek-chat]

models:
  - id: deepseek-v4-pro
    display_name: DeepSeek V4 Pro
    model_type: chat
    provider: openai_compatible
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    extra_body:
      thinking:
        type: disabled
    streaming: true
    # 成本计算使用“美元 / 100 万 token”。
    # 这里填写 DeepSeek 官方价目表；如果厂商或合同价变化，要同步更新配置。
    # deepseek-v4-pro 当前官方折扣价有效期到 2026-05-31 15:59 UTC。
    input_price_per_1m_tokens: 0.435
    output_price_per_1m_tokens: 0.87
    input_cache_hit_price_per_1m_tokens: 0.003625
    input_cache_miss_price_per_1m_tokens: 0.435
    api_key_env: LLM_API_KEY
    enabled: true
    priority: 5
    tier: strong
    deployment: cloud
    use_cases: ["agent", "workflow", "plan_execute", "supervisor", "multi_agent", "judge", "planner", "replan", "replanner"]

  - id: deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    model_type: chat
    provider: openai_compatible
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    extra_body:
      thinking:
        type: disabled
    streaming: false
    input_price_per_1m_tokens: 0.14
    output_price_per_1m_tokens: 0.28
    input_cache_hit_price_per_1m_tokens: 0.0028
    input_cache_miss_price_per_1m_tokens: 0.14
    api_key_env: LLM_API_KEY
    enabled: true
    priority: 6
    tier: small
    deployment: cloud
    use_cases: ["mcp", "workflow_finalize", "structured_extract", "rag_rewrite", "rag_compress", "memory_extraction", "intent_classification", "query_rewrite", "case_extraction"]

  - id: deepseek-chat
    display_name: DeepSeek Chat
    model_type: chat
    provider: openai_compatible
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: LLM_API_KEY
    input_price_per_1m_tokens: 0.14
    output_price_per_1m_tokens: 0.28
    input_cache_hit_price_per_1m_tokens: 0.0028
    input_cache_miss_price_per_1m_tokens: 0.14
    enabled: false
    priority: 10
    tier: strong
    deployment: cloud
    use_cases: ["agent", "workflow", "plan_execute", "supervisor", "multi_agent", "mcp", "workflow_finalize", "structured_extract", "rag_rewrite", "rag_compress", "judge", "memory_extraction", "intent_classification", "query_rewrite", "planner", "replan", "replanner", "case_extraction"]

  # 轻量云模型：适合 RAG query 改写、片段压缩、结构化抽取。
  - id: qwen-flash
    display_name: Qwen Flash
    model_type: chat
    provider: openai_compatible
    model: qwen-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    enabled: true
    priority: 5
    tier: small
    deployment: cloud
    use_cases: ["mcp", "rag_rewrite", "rag_compress", "structured_extract", "workflow_finalize", "memory_extraction", "intent_classification", "query_rewrite", "case_extraction"]

  # 本地开源小模型示例：vLLM / Ollama / LM Studio 都可以提供 OpenAI-compatible 接口。
  # 例如本地启动 http://localhost:8003/v1 后，将 enabled 改成 true，
  # 再把 default_models.rag_rewrite / structured_extract 指到 local-qwen-small。
  - id: local-qwen-small
    display_name: Local Qwen Small
    model_type: chat
    provider: openai_compatible
    model: qwen2.5:7b-instruct
    base_url: http://localhost:8003/v1
    api_key_env: LOCAL_LLM_API_KEY
    requires_api_key: false
    enabled: false
    priority: 1
    tier: small
    deployment: local
    use_cases: ["mcp", "rag_rewrite", "rag_compress", "structured_extract", "workflow_finalize", "memory_extraction", "intent_classification", "query_rewrite", "case_extraction"]

  - id: qwen3.7-max
    display_name: Qwen3.7 Max
    model_type: chat
    provider: openai_compatible
    model: qwen3.7-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    enabled: true
    priority: 20
    tier: strong
    deployment: cloud
    use_cases: ["agent", "workflow", "plan_execute", "supervisor", "multi_agent", "workflow_finalize", "planner", "replan", "replanner"]

  - id: kimi-chat
    display_name: Moonshot Kimi
    model_type: chat
    provider: openai_compatible
    model: moonshot-v1-8k
    base_url: https://api.moonshot.cn/v1
    api_key_env: KIMI_API_KEY
    enabled: false
    priority: 30
    tier: standard
    deployment: cloud
    use_cases: ["agent", "workflow", "plan_execute", "workflow_finalize", "planner", "replan", "replanner"]

  - id: claude-sonnet
    display_name: Claude Sonnet
    model_type: chat
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    api_key_env: ANTHROPIC_API_KEY
    enabled: false
    priority: 40
    tier: strong
    deployment: cloud
    use_cases: ["agent", "supervisor", "judge"]

  # 本地开源 Embedding：适合中文 RAG，默认启用，不需要 API Key。
  - id: bge-small-zh
    display_name: BGE Small ZH
    model_type: embedding
    provider: huggingface
    model: BAAI/bge-small-zh-v1.5
    requires_api_key: false
    enabled: true
    priority: 10
    tier: small
    deployment: local
    dimension: 512
    use_cases: ["embedding"]

  # 云端 Embedding：适合生产托管或跨语言语义检索；启用时需要 OPENAI_API_KEY。
  - id: openai-embedding-small
    display_name: OpenAI text-embedding-3-small
    model_type: embedding
    provider: openai
    model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY
    enabled: false
    priority: 20
    tier: small
    deployment: cloud
    dimension: 1536
    use_cases: ["embedding"]

  # 阿里云百炼 Embedding：走 OpenAI 兼容接口，适合企业云端托管。
  # 当前项目使用 text-embedding-v4 的 1024 维配置。
  # 注意：MILVUS_DIM / LONG_TERM_MEMORY_VECTOR_DIMENSION 必须和这里保持一致。
  - id: aliyun-text-embedding-v4
    display_name: Aliyun text-embedding-v4
    model_type: embedding
    provider: openai_compatible
    model: text-embedding-v4
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    enabled: true
    priority: 15
    tier: standard
    deployment: cloud
    dimension: 1024
    use_cases: ["embedding"]

  # 本地开源 Reranker：更适合企业内网部署，第一次调用时懒加载模型。
  - id: bge-reranker-base
    display_name: BGE Reranker Base
    model_type: reranker
    provider: sentence_transformers
    model: BAAI/bge-reranker-base
    requires_api_key: false
    enabled: true
    priority: 10
    tier: standard
    deployment: local
    top_k: 5
    use_cases: ["reranker"]

  # 阿里云百炼 Reranker：用于 RAG 二次精排，走 OpenAI-compatible /reranks 接口。
  - id: aliyun-qwen3-rerank
    display_name: Aliyun Qwen3 Rerank
    model_type: reranker
    provider: dashscope
    model: qwen3-rerank
    base_url: https://dashscope.aliyuncs.com/compatible-api/v1/reranks
    api_key_env: DASHSCOPE_API_KEY
    enabled: true
    priority: 15
    tier: standard
    deployment: cloud
    top_k: 5
    use_cases: ["reranker"]
