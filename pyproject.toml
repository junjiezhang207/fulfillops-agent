[project]
name = "multiship-agent"
version = "0.1.0"
description = "全域电商供应链智能履约多Agent平台学习型演示项目"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12,<1.0.0",
    "uvicorn>=0.34.2,<1.0.0",
    "pydantic-settings>=2.9.1,<3.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
    "alembic>=1.15.2,<2.0.0",
    "redis>=5.2.1,<6.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "pymilvus>=2.5.6,<3.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "llama-index>=0.12.33,<0.13.0",
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-asyncio>=0.26.0,<1.0.0",
    "langchain-anthropic>=1.4.1",
    "langchain-openai>=1.1.9",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.0.1",
    "langchain-community>=0.4.1",
    "llama-index-retrievers-bm25>=0.5.2",
    "langgraph-checkpoint-redis>=0.4.1",
    # ── Agent Evaluation ──────────────────────────────────────────────
    "ragas>=0.2.0",            # RAG 质量指标（faithfulness / answer_relevancy）
    "deepeval>=2.0.0",         # CI 回归测试框架（AnswerRelevancy / GEval）
    "datasets>=3.0.0",         # Ragas 依赖的 HuggingFace datasets
    # ── 本轮新增 ─────────────────────────────────────────────────────────────
    "sentence-transformers>=3.0.0",  # Cross-Encoder 重排（BAAI/bge-reranker-base）
    "llama-index-embeddings-huggingface>=0.5.5",
    "pyyaml>=6.0.3",
    "prometheus-client>=0.25.0",
    "llama-index-vector-stores-milvus>=0.8.7",
    "pdfplumber>=0.11.5",
    "python-docx>=1.1.2",
    "charset-normalizer>=3.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: 需要 LLM 的慢速 DeepEval 评测（CI 跳过，本地加 --slow 运行）",
]
# eval 目录默认不在常规 CI 中收集，需手动指定
testpaths = ["tests"]
